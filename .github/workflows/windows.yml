name: Build Black for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          mkdir -p build
          make

      - name: Package
        shell: bash
        run: |
          cp "$(find . -type f -name 'black.exe' -o -name 'black' | head -1)" build/black.exe
          7z a black-windows-x64.zip build/black.exe

      - uses: actions/upload-artifact@v4
        with:
          name: black-windows-x64
          path: black-windows-x64.zip
          
