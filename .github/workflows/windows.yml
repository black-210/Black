name: Build Black for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          choco install mingw -y
          gcc --version

      - name: Build Black
        shell: bash
        run: |
          mkdir -p build
          gcc -std=c11 -O2 -Iinclude src/*.c -o build/black.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-windows-x64
          path: build/black.exe
